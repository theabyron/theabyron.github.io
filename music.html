.sidebar{position:fixed;z-index:40;top:0;bottom:0;left:-310px;width:290px;background:#0b0a09;border-right:1px solid #3b352d;padding:95px 24px 24px;transition:.28s;box-shadow:18px 0 45px #0008}
.sidebar.open{left:0}.close{position:absolute;top:18px;right:20px;background:none;border:0;color:#f5ead7;font-size:25px;cursor:pointer}
.side-kicker,.eyebrow{font-size:9px;letter-spacing:.28em;color:#d8bd8d;text-transform:uppercase}
.side-title{font:32px Georgia,serif;margin:12px 0 35px}.nav a{display:block;padding:15px 8px;border-bottom:1px solid #282520;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.overlay{position:fixed;inset:0;background:#0008;z-index:35;display:none}.overlay.show{display:block}
main{padding:120px 7% 70px;min-height:100vh}
.hero-title{font:clamp(55px,9vw,105px)/.9 Georgia,serif;margin:14px 0 22px}.lead{max-width:760px;color:#aaa;line-height:1.8}
.section{margin-top:55px}.section h2{font:38px Georgia,serif;margin:0 0 18px}
.song{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#10100f;border:1px solid #2b2925;padding:18px 20px;margin:9px 0}
.song-title{font:23px Georgia,serif;margin-bottom:7px}.meta{font-size:9px;letter-spacing:.13em;color:#8f877d;text-transform:uppercase}

.footer{border-top:1px solid #2b2925;padding:28px 7%;color:#777;font-size:9px;letter-spacing:.13em;text-transform:uppercase;display:flex;justify-content:space-between}
