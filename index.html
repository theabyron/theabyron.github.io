<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE ABYRON — Independent Music Label</title><meta name="description" content="THE ABYRON — independent music label for music, artists, vlogs and stories."><link rel="icon" href="assets/the-abyron-favicon.png"><link rel="manifest" href="site.webmanifest"><style>
:root{--bg:#070706;--panel:#10100f;--line:#2d2923;--text:#f4ead9;--muted:#999;--gold:#d8bd8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.top{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;position:sticky;top:0;background:rgba(7,7,6,.94);backdrop-filter:blur(8px);z-index:5}.logo{width:150px;height:45px;object-fit:contain}.nav{margin-left:auto}.nav a{color:var(--gold);margin:0 8px;text-decoration:none}main{max-width:1100px;margin:auto;padding:60px 20px}.hero{font:80px Georgia,serif;margin:15px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:4px}.media{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:3px;margin-bottom:10px}.card a{color:var(--gold)}section{margin-top:60px}footer{padding:30px 20px;border-top:1px solid var(--line);color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{font-size:55px}.nav{display:none}}
</style></head><body><header class="top"><a href="index.html"><img class="logo" src="assets/the-abyron-logo.png" alt="THE ABYRON"></a><nav class="nav"><a href="#music">Music</a><a href="#vlogs">Vlogs</a><a href="#blog">Blog</a><a href="#artists">Artists</a></nav></header><main><div class="muted">INDEPENDENT MUSIC LABEL</div><h1 class="hero">THE ABYRON</h1><p class="muted">Music, vlogs, stories and artists — published directly from THE ABYRON.</p><section id="music"><h2>Music</h2><div id="musicGrid" class="grid"></div></section><section id="vlogs"><h2>Vlogs</h2><div id="vlogGrid" class="grid"></div></section><section id="blog"><h2>Blog</h2><div id="blogGrid" class="grid"></div></section><section id="artists"><h2>Artists</h2><div id="artistGrid" class="grid"></div></section></main><footer>© 2026 THE ABYRON</footer><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,collection,getDocs,query,where,orderBy}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";import{FIREBASE_CONFIG}from"./firebase-config.js";const ready=FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith("PASTE_")&&FIREBASE_CONFIG.projectId&&!FIREBASE_CONFIG.projectId.startsWith("PASTE_");const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const firebaseApp=ready?initializeApp(FIREBASE_CONFIG):null;const db=ready?getFirestore(firebaseApp):null;
async function load(c,id){const e=document.getElementById(id);if(!ready){e.innerHTML='<p class="muted">Website is being connected to Firebase.</p>';return}try{const s=await getDocs(query(collection(db,c),where("published","==",true)));const docs=[...s.docs].sort((a,b)=>{const at=a.data().createdAt,bt=b.data().createdAt;return (bt?.toMillis?.()||0)-(at?.toMillis?.()||0)});e.innerHTML=docs.length===0?'<p class="muted">Nothing published yet.</p>':docs.map(d=>{const x=d.data();return '<article class="card">'+(x.imageUrl?'<img class="media" src="'+esc(x.imageUrl)+'" alt="">':'')+'<h3>'+esc(x.title)+'</h3>'+(x.category?'<div class="muted">'+esc(x.category)+'</div>':'')+'<p class="muted">'+esc(x.description)+'</p>'+(x.link?'<a href="'+esc(x.link)+'" target="_blank" rel="noopener">Open ↗</a>':'')+'</article>'}).join("")}catch(err){console.error(c,err);e.innerHTML='<p class="muted">Content temporarily unavailable.</p>'}}load("music","musicGrid");load("vlogs","vlogGrid");load("blogs","blogGrid");load("artists","artistGrid");
</script></body></html>
